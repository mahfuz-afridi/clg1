<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BAF Shaheen College Chattogram</title>
    <meta name="description" content="Log in to your BAF Shaheen College Chattogram account.">
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c1424" media="(prefers-color-scheme: dark)">

    <!-- Apply saved / system theme before first paint (same key as the homepage) -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("baf-theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Shared design system, then login-specific styles -->
    <link rel="stylesheet" href="../homee.css">
    <link rel="stylesheet" href="login.css">

    <script src="login.js" defer></script>
</head>

<body class="login-body">

    <a href="#main" class="skip-link">Skip to main content</a>

    <!-- ================= HEADER ================= -->

    <header class="header">
        <div class="container navbar">

            <a href="../index.html" class="logo" aria-label="BAF Shaheen College Chattogram — home">
                <div class="logo-icon">
                    <img src="Screenshot_2026-08-14_194615-removebg-preview.png" alt="" width="48" height="48">
                </div>
                <div class="logo-text">
                    <strong>BAF Shaheen College Chattogram</strong>
                    <span>Learn. Grow. Succeed.</span>
                </div>
            </a>

            <div class="nav-actions">
                <a href="../index.html" class="header-home">
                    <i class="fa-solid fa-house" aria-hidden="true"></i>
                    <span>Home</span>
                </a>

                <button type="button" class="theme-toggle" id="themeToggle"
                        aria-label="Switch to dark theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                </button>
            </div>

        </div>
    </header>


    <!-- ================= LOGIN ================= -->

    <main id="main" class="login-main">

        <div class="login-card">

            <div class="login-logo">
                <img src="Screenshot_2026-08-14_194615-removebg-preview.png"
                     alt="BAF Shaheen College Chattogram logo">
            </div>

            <span class="small-title">Student &amp; Staff Portal</span>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your college account
            </p>

            <form id="loginForm" novalidate>

                <!-- Login ID -->
                <div class="input-group">
                    <label for="loginId">Login ID</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <input type="text"
                               id="loginId"
                               name="loginId"
                               placeholder="Enter your Login ID"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                                aria-controls="password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember / Forgot -->
                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>

                <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>

            </form>

            <a href="../index.html" class="back-home">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Back to Home
            </a>

        </div>

    </main>

</body>

</html>
